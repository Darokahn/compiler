# C spec char literal parsing

charliteralstart:
  token: bad
  defaultedge: charliteralchewedone

  backslash: charliteralescape
  eof: cantmove
  newline: cantmove
  singlequote: cantmove

charliteralchewedone:
  token: bad
  defaultedge: charliteralchewedone

  backslash: charliteralescape
  eof: cantmove
  newline: cantmove
  singlequote: charliteral

charliteralescape:
  token: bad

  singlequote: charliteralchewedone
  '"': charliteralchewedone
  '?': charliteralchewedone
  backslash: charliteralchewedone
  a: charliteralchewedone
  b: charliteralchewedone
  f: charliteralchewedone
  n: charliteralchewedone
  r: charliteralchewedone
  t: charliteralchewedone
  v: charliteralchewedone
  octal: charescapeoctal0
  x: charescapehexempty

charescapeoctal0:
  token: bad

  octal: charescapeoctal1
  singlequote: charliteral

charescapeoctal1:
  token: bad

  octal: charliteralchewedone
  singlequote: charliteral

charescapehexempty:
  token: bad

  hexadecimal: charescapehex

charescapehex:
  token: bad

  hexadecimal: charescapehex
  singlequote: charliteral

