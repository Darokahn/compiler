# Use `default` to provide a definition for each unspecified edge. Omit it for `default` to be `cantmove`.
# Use `token` to specify what token type should be emitted if this state transitions to `cantmove`. Omit for a token named the same as the state.

start:
  defaultedge: cantmove
  token: bad

  letter: identifier
  '0': nondecimal
  nonzerodecimal: decimal
  whitespace: whitespace
  newline: newline
  '%': mod
  '-': minus
  '+': plus
  '^': caret
  '~': tilde
  '(': lparen
  ')': rparen
  '{': lcurly
  '}': rcurly
  ']': rbracket
  '[': lbracket
  '?': question
  ';': semicolon
  ':': colon
  '=': maybeEq
  '<': langle
  '>': rangle
  slash: div
  '*': star
  '#': preproc
  '&': amp
  comma: comma
  dot: dot
  '!': exc
  '"': stringliteralstart
  '|': pipe
  singlequote: charliteralstart
  eof: eof

colon:
  '=': assignment

identifier:
  letter: identifier
  decimal: identifier

mod:
  '=': modeq

minus:
  '=': minuseq
  '>': arrow

caret:
  '=': xoreq

tilde:
  '=': bnoteq

pipe:
  '=': boreq
  '|': lor

maybeEq:
  token: bad
  '=': eq

plus:
  '=': pluseq

langle:
  '<': shiftleft
  '=': le

rangle:
  '>': shiftright
  '=': ge

div:
  slash: linecomment
  '*': blockcomment

linecomment:
  defaultedge: linecomment

  newline: cantmove
  eof: cantmove

blockcomment:
  defaultedge: blockcomment
  token: bad

  eof: cantmove
  '*': blockcommentweak

blockcommentweak:
  defaultedge: blockcomment
  token: bad

  eof: cantmove
  '*': blockcommentweak
  slash: blockcommentfinish

blockcommentfinish:
  token: blockcomment

amp:
  '=': bandeq
  '&': and

star:
  '=': timeseq

exc:
  '=': noteq

preproc:
  defaultedge: preproc
  newline: cantmove
  eof: cantmove

whitespace:
  whitespace: whitespace
  newline: newline
